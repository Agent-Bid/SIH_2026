; Real-speed recorder for the sonar DAC (see src/main.cpp)
;   pio run -t upload                 BlackPill USB-C DFU: hold BOOT0, tap NRST, release BOOT0 first
;   pio run -e probe -t upload        through the Pico debugprobe (SWD), as in the LASC projects
[env:blackpill]
platform = ststm32
board = blackpill_f411ce
framework = arduino
board_build.f_cpu = 72000000L         ; 72 MHz so the ADC clock is exactly 36 MHz (2.4 MS/s)
upload_protocol = dfu
build_flags =
  -D USBCON
  -D USBD_USE_CDC
  -D USBD_VID=0x0483
  -D USBD_PID=0x5740

[env:probe]
extends = env:blackpill
upload_protocol = cmsis-dap
debug_tool = cmsis-dap
upload_flags =
  -c
  adapter speed 500
